<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes gRoll0{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-200deg) scale(.8)}60%{transform:rotate(-320deg) scale(1.1)}100%{transform:rotate(-360deg) scale(1)}} @keyframes gRoll1{0%{transform:rotate(0) scale(1)}30%{transform:rotate(200deg) scale(.8)}60%{transform:rotate(320deg) scale(1.1)}100%{transform:rotate(360deg) scale(1)}}</style></helmet>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Fredoka', system-ui, sans-serif; color:#1F2357">
  <div style="background:#fff; border-radius:34px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 16px 0 rgba(31,35,87,.18)">
    <div style="border-radius:999px; padding:10px 16px; font-weight:600; font-size:14px; text-align:center; background:{{ status.bg }}; color:{{ status.color }}">{{ status.text }}</div>
    <div dir="ltr" style="display:grid; grid-template-columns:repeat(5,1fr); gap:8px">
      <sc-for list="{{ dice }}" as="d" hint-placeholder-count="5">
        <button onClick="{{ d.onClick }}" style="aspect-ratio:1; border-radius:16px; cursor:pointer; padding:8px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2px; background:{{ d.bg }}; border:3px solid {{ d.border }}; box-shadow:0 4px 0 {{ d.border }}; animation:{{ d.anim }}">
          <sc-for list="{{ d.pips }}" as="p" hint-placeholder-count="9">
            <span style="border-radius:50%; background:{{ p.c }}"></span>
          </sc-for>
        </button>
      </sc-for>
    </div>
    <div style="display:flex; gap:8px; align-items:center">
      <button onClick="{{ roll }}" style="flex:1; border:0; cursor:pointer; border-radius:999px; padding:12px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670; opacity:{{ rollOpacity }}">{{ rollLabel }}</button>
      <span style="font-size:13px; color:#6B70A0">{{ t.hold }}</span>
    </div>
    <div style="border-radius:22px; overflow:hidden; border:3px solid #EEF0FF">
      <div style="display:grid; grid-template-columns:minmax(0,1fr) 70px 70px; background:#EEF0FF; font-size:12px; font-weight:600; color:#4B5BE8">
        <span style="padding:8px 12px"></span><span style="padding:8px; text-align:center">{{ meName }}</span><span style="padding:8px; text-align:center">{{ friendName }}</span>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
        <div onClick="{{ r.onClick }}" style="display:grid; grid-template-columns:minmax(0,1fr) 70px 70px; border-top:2px solid #EEF0FF; font-size:14px; cursor:{{ r.cursor }}; background:{{ r.bg }}">
          <span style="padding:7px 12px; font-weight:600">{{ r.name }}</span>
          <span style="padding:7px; text-align:center; font-weight:700; color:{{ r.meColor }}">{{ r.me }}</span>
          <span style="padding:7px; text-align:center; font-weight:700; color:#FF8A2A">{{ r.friend }}</span>
        </div>
      </sc-for>
      <div style="display:grid; grid-template-columns:minmax(0,1fr) 70px 70px; border-top:2px solid #EEF0FF; background:#1F2357; color:#fff; font-weight:700">
        <span style="padding:8px 12px">{{ t.total }}</span><span style="padding:8px; text-align:center">{{ totals.me }}</span><span style="padding:8px; text-align:center">{{ totals.friend }}</span>
      </div>
    </div>
  </div>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff; border-radius:30px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; box-shadow:0 14px 34px rgba(31,35,87,.2)">
      <div style="align-self:stretch; background:#4B5BE8; color:#fff; border-radius:999px; padding:10px; font-weight:700; font-size:18px">{{ res.title }}</div>
      <div style="font-size:44px; font-weight:700; line-height:1; color:{{ res.color }}">{{ res.pts }}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; align-self:stretch">
        <button onClick="{{ restart }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ labels.again }}</button>
        <button onClick="{{ back }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#4B5BE8; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #3343C9">{{ labels.back }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:720}}">
const CATS = ['1','2','3','4','5','6','E','F','P','G'];
const NAMES = { es:{ E:'Escalera', F:'Full', P:'Póker', G:'Generala' }, he:{ E:'סולם', F:'פול', P:'פוקר', G:'גנרלה' } };
const T = { es:{ roll:'Tirar ({n} de 3)', pick:'Elegí dónde anotar', first:'Tirá los dados', hold:'Tocá un dado para guardarlo', total:'Total', scored:'{n} anotó {c}: {v}', rolling:'{n} está tirando…' },
            he:{ roll:'הטלה ({n} מתוך 3)', pick:'בחרו איפה לרשום', first:'הטילו את הקוביות', hold:'לחצו על קובייה כדי לשמור', total:'סה״כ', scored:'{n} רשם/ה {c}: {v}', rolling:'{n} מטיל/ה…' } };
const fmt = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k] ?? '');
const PIPS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
const r6 = () => 1 + Math.floor(Math.random() * 6);
const counts = d => { const c = Array(7).fill(0); d.forEach(v => c[v]++); return c; };
const scoreOf = (cat, d) => { const c = counts(d); const s = c.slice(1).sort((a, b) => b - a);
  if (/[1-6]/.test(cat)) return c[+cat] * +cat;
  if (cat === 'E') { const u = [...new Set(d)].sort().join(''); return u === '12345' || u === '23456' ? 20 : 0; }
  if (cat === 'F') return s[0] === 3 && s[1] === 2 ? 30 : 0;
  if (cat === 'P') return s[0] >= 4 ? 40 : 0;
  if (cat === 'G') return s[0] === 5 ? 50 : 0; };

class Component extends DCLogic {
  init() { return { dice:[1,2,3,4,5], held:[false,false,false,false,false], rolls:0, sheet:{ me:{}, friend:{} }, turn:'me', msg:'', result:null }; }
  state = this.init();
  componentWillUnmount() { clearTimeout(this.tm); }
  get d() { return this.props.delay ?? 700; }
  roll = () => { const s = this.state; if (s.turn !== 'me' || s.rolls >= 3 || s.result) return;
    this.rollN = (this.rollN || 0) + 1; this.rolled = s.dice.map((_, i) => !(s.rolls && s.held[i])); this.setState({ dice:s.dice.map((v, i) => s.rolls && s.held[i] ? v : r6()), rolls:s.rolls + 1, msg:'' }); };
  hold(i) { const s = this.state; if (s.turn !== 'me' || !s.rolls) return; const h = s.held.slice(); h[i] = !h[i]; this.setState({ held:h }); }
  write(who, cat) {
    const s = this.state; const sheet = { ...s.sheet, [who]:{ ...s.sheet[who], [cat]:scoreOf(cat, s.dice) } };
    this.setState({ sheet, rolls:0, held:[false,false,false,false,false] });
    return sheet;
  }
  pick(cat) { const s = this.state; if (s.turn !== 'me' || !s.rolls || cat in s.sheet.me || s.result) return;
    const sheet = this.write('me', cat); this.setState({ turn:'friend' });
    if (this.over(sheet)) return; this.tm = setTimeout(() => this.ai(0), this.d); }
  over(sheet) { if (Object.keys(sheet.me).length < 10 || Object.keys(sheet.friend).length < 10) return false;
    const a = Object.values(sheet.me).reduce((x, y) => x + y, 0), b = Object.values(sheet.friend).reduce((x, y) => x + y, 0);
    const w = a > b ? 'me' : b > a ? 'friend' : 'draw'; this.setState({ result:w }); this.props.onFinish && this.props.onFinish(w); return true; }
  ai(n) {
    const s = this.state; const open = CATS.filter(c => !(c in s.sheet.friend));
    let held = [false,false,false,false,false];
    if (n > 0) { const c = counts(s.dice); const u = [...new Set(s.dice)];
      const straight = open.includes('E') && u.length >= 4 && (u.filter(v => v >= 2 && v <= 5).length >= 4 || u.filter(v => v <= 4).length >= 4);
      if (straight) { const seen = new Set(); held = s.dice.map(v => !seen.has(v) && (seen.add(v), true)); }
      else { let best = 6; for (let v = 6; v >= 1; v--) if (c[v] > c[best]) best = v; held = s.dice.map(v => v === best); } }
    const dice = s.dice.map((v, i) => held[i] ? v : r6()); this.rollN = (this.rollN || 0) + 1; this.rolled = held.map(h => !h);
    this.setState({ dice, held, rolls:n + 1, msg:'' });
    const opts = open.map(c => ({ c, v:scoreOf(c, dice) }));
    const great = opts.filter(o => /[EFPG]/.test(o.c) && o.v > 0);
    if (n < 2 && !great.length) { this.tm = setTimeout(() => this.ai(n + 1), this.d); return; }
    this.tm = setTimeout(() => {
      let ch = great.sort((a, b) => b.v - a.v)[0] || opts.filter(o => o.v > 0).sort((a, b) => b.v / (/[1-6]/.test(b.c) ? +b.c * 5 : 50) - a.v / (/[1-6]/.test(a.c) ? +a.c * 5 : 50))[0];
      if (!ch) { const order = ['G','1','2','P','3','F','E','4','5','6']; ch = { c:order.find(c => open.includes(c)) }; }
      const lang = this.props.lang === 'he' ? 'he' : 'es'; const v = scoreOf(ch.c, this.state.dice);
      const sheet = this.write('friend', ch.c);
      this.setState({ turn:'me', msg:fmt(T[lang].scored, { n:this.props.friendName || '', c:NAMES[lang][ch.c] || ch.c, v }) });
      this.over(sheet);
    }, this.d);
  }
  renderVals() {
    const L = this.props.labels || {}; const lang = this.props.lang === 'he' ? 'he' : 'es'; const t = T[lang];
    const s = this.state; const myTurn = s.turn === 'me' && !s.result; const fn = this.props.friendName || '';
    const sum = o => Object.values(o).reduce((x, y) => x + y, 0);
    return {
      t, labels:L, meName:this.props.meName, friendName:fn, done:!!s.result, totals:{ me:sum(s.sheet.me), friend:sum(s.sheet.friend) },
      status: s.result ? { text: s.result === 'me' ? L.win : s.result === 'draw' ? L.draw : L.lose, bg:'#1F2357', color:'#fff' }
        : myTurn ? { text: s.msg || (s.rolls ? t.pick : t.first), bg:'#FFC93C', color:'#1F2357' } : { text:fmt(t.rolling, { n:fn }), bg:'#FFE6D2', color:'#B5560F' },
      dice: s.dice.map((v, i) => ({ anim: this.rolled && this.rolled[i] ? `gRoll${this.rollN % 2} .55s cubic-bezier(.3,.7,.4,1)` : 'none', onClick:() => this.hold(i), bg: s.held[i] ? '#FFE0EC' : '#fff', border: s.held[i] ? '#F2508E' : '#DDE1FF',
        pips:Array.from({ length:9 }, (_, k) => ({ c: PIPS[v].includes(k) ? (s.turn === 'me' ? '#1F2357' : '#FF8A2A') : 'transparent' })) })),
      roll:this.roll, rollLabel:fmt(t.roll, { n:Math.min(3, s.rolls + 1) }), rollOpacity: myTurn && s.rolls < 3 ? 1 : .4,
      rows: CATS.map(c => { const has = c in s.sheet.me; const can = myTurn && s.rolls && !has;
        return { name: NAMES[lang][c] || c, me: has ? s.sheet.me[c] : can ? scoreOf(c, s.dice) : '–', meColor: has ? '#F2508E' : '#A3A7C7',
          friend: c in s.sheet.friend ? s.sheet.friend[c] : '–', cursor: can ? 'pointer' : 'default', bg: can ? '#FFFBEA' : '#fff', onClick:() => this.pick(c) }; }),
      res: s.result ? { title: s.result === 'me' ? L.win : s.result === 'draw' ? L.draw : L.lose, pts: s.result === 'me' ? '+30' : s.result === 'draw' ? '+10' : '+0', color: s.result === 'me' ? '#F2508E' : s.result === 'draw' ? '#4B5BE8' : '#FF8A2A' } : {},
      restart:() => { clearTimeout(this.tm); this.setState(this.init()); }, back:() => this.props.onBack && this.props.onBack()
    };
  }
}
</script>
</body>
</html>
