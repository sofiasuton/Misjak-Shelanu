<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Fredoka', system-ui, sans-serif; color:#1F2357">
  <div style="background:#fff; border-radius:34px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 16px 0 rgba(31,35,87,.18)">
    <div style="display:flex; gap:8px; align-items:center">
      <div style="flex:1; border-radius:999px; padding:10px 14px; font-weight:600; font-size:14px; text-align:center; background:{{ status.bg }}; color:{{ status.color }}">{{ status.text }}</div>
      <sc-if value="{{ showTimer }}" hint-placeholder-val="{{ true }}">
        <span style="border-radius:999px; padding:8px 14px; background:#1F2357; color:#fff; font-weight:700; font-size:15px">{{ timer }}</span>
      </sc-if>
    </div>

    <sc-if value="{{ isDraw }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; flex-direction:column; gap:10px">
        <div style="text-align:center; font-size:14px; color:#6B70A0">{{ t.drawThis }} <span style="font-weight:700; font-size:20px; color:#F2508E">{{ myWord }}</span></div>
        <canvas ref="{{ cvRef }}" width="700" height="560" onPointerDown="{{ pd }}" onPointerMove="{{ pm }}" onPointerUp="{{ pu }}" onPointerLeave="{{ pu }}" style="width:100%; aspect-ratio:700/560; background:#F5F6FB; border-radius:22px; border:3px solid #DDE1FF; touch-action:none; cursor:crosshair"></canvas>
        <div style="display:flex; gap:8px; align-items:center; justify-content:space-between">
          <div style="display:flex; gap:6px">
            <sc-for list="{{ colors }}" as="c" hint-placeholder-count="5">
              <button onClick="{{ c.onClick }}" aria-label="color" style="width:32px; height:32px; border-radius:50%; cursor:pointer; background:{{ c.c }}; border:3px solid {{ c.ring }}"></button>
            </sc-for>
          </div>
          <button onClick="{{ clear }}" style="border:3px solid #DDE1FF; cursor:pointer; border-radius:999px; padding:6px 14px; background:#fff; color:#4B5BE8; font-family:inherit; font-weight:600; font-size:14px">{{ t.clear }}</button>
        </div>
        <button onClick="{{ doneDraw }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ t.ready }}</button>
      </div>
    </sc-if>

    <sc-if value="{{ isMid }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; padding:10px 0">
        <div style="font-size:20px; font-weight:600">{{ midText }}</div>
        <sc-if value="{{ canGuess }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ startGuess }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px 26px; background:#4B5BE8; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #3343C9">{{ t.yourGuess }}</button>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ isGuess }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:12px">
        <div style="aspect-ratio:700/460; background:#F5F6FB; border-radius:22px; border:3px solid #DDE1FF; display:flex; align-items:center; justify-content:center; overflow:hidden">
          <span style="font-size:140px; line-height:1; filter:blur({{ blur }}px); transition:filter 1s linear">{{ friendEmoji }}</span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
          <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
            <button onClick="{{ o.onClick }}" style="border:3px solid #DDE1FF; cursor:pointer; border-radius:999px; padding:12px; background:#fff; color:#1F2357; font-family:inherit; font-weight:600; font-size:16px">{{ o.label }}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff; border-radius:30px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; box-shadow:0 14px 34px rgba(31,35,87,.2)">
      <div style="align-self:stretch; background:#4B5BE8; color:#fff; border-radius:999px; padding:10px; font-weight:700; font-size:18px">{{ res.title }}</div>
      <div style="font-size:44px; font-weight:700; line-height:1; color:{{ res.color }}">{{ res.pts }}</div>
      <div style="font-size:14px; color:#6B70A0">{{ res.sub }}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; align-self:stretch">
        <button onClick="{{ restart }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ labels.again }}</button>
        <button onClick="{{ back }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#4B5BE8; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #3343C9">{{ labels.back }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:640}}">
const WORDS = [['gato','חתול','🐱'],['pizza','פיצה','🍕'],['casa','בית','🏠'],['sol','שמש','☀️'],['árbol','עץ','🌳'],['auto','מכונית','🚗'],['pez','דג','🐟'],['guitarra','גיטרה','🎸'],['avión','מטוס','✈️'],['helado','גלידה','🍦'],['luna','ירח','🌙'],['flor','פרח','🌸'],['camello','גמל','🐪'],['pelota','כדור','⚽'],['cactus','קקטוס','🌵'],['barco','סירה','⛵'],['reloj','שעון','⏰'],['montaña','הר','⛰️'],['banana','בננה','🍌'],['corazón','לב','❤️'],['perro','כלב','🐶'],['cohete','טיל','🚀'],['paraguas','מטרייה','☂️'],['bicicleta','אופניים','🚲']];
const T = { es:{ draw:'Dibujá para que {n} adivine', drawThis:'Dibujá:', clear:'Borrar', ready:'¡Listo!', guessing:'{n} está mirando tu dibujo…', got:'{n} adivinó en {s} s', miss:'{n} no lo adivinó', yourGuess:'Ahora adiviná el de {n}', guess:'¿Qué dibujó {n}?', sub:'Vos {a} · {n} {b}' },
            he:{ draw:'ציירו כדי ש{n} ינחש', drawThis:'ציירו:', clear:'מחיקה', ready:'מוכן!', guessing:'{n} מסתכל/ת על הציור…', got:'{n} ניחש/ה תוך {s} שניות', miss:'{n} לא ניחש/ה', yourGuess:'עכשיו נחשו את הציור של {n}', guess:'מה {n} צייר/ה?', sub:'את/ה {a} · {n} {b}' } };
const fmt = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k] ?? '');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PAL = ['#1F2357','#F2508E','#FF8A2A','#7FC21F','#4B5BE8'];

class Component extends DCLogic {
  init() { const w = shuffle(WORDS); return { mine:w[0], theirs:w[1], opts:shuffle([w[1], w[2], w[3], w[4]]), phase:'draw', sec:60, color:PAL[0], fPts:0, fTime:0, mPts:0, result:null }; }
  state = this.init();
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tm); }
  tick() { clearInterval(this.iv); this.iv = setInterval(() => {
    const s = this.state;
    if (s.phase === 'draw') { if (s.sec <= 1) this.doneDraw(); else this.setState({ sec:s.sec - 1 }); }
    else if (s.phase === 'guess') { if (s.sec >= 20) this.pick(null); else this.setState({ sec:s.sec + 1 }); }
  }, 1000); }
  cvRef = el => { this.cv = el; };
  pos(e) { const r = this.cv.getBoundingClientRect(); return [(e.clientX - r.left) * 700 / r.width, (e.clientY - r.top) * 560 / r.height]; }
  pd = e => { if (!this.cv) return; this.drawing = true; this.cv.setPointerCapture && this.cv.setPointerCapture(e.pointerId); this.last = this.pos(e); this.dot(this.last); this.strokes = (this.strokes || 0) + 1; };
  pm = e => { if (!this.drawing || !this.cv) return; const p = this.pos(e); const c = this.cv.getContext('2d'); c.strokeStyle = this.state.color; c.lineWidth = 12; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(...this.last); c.lineTo(...p); c.stroke(); this.last = p; };
  pu = () => { this.drawing = false; };
  dot(p) { const c = this.cv.getContext('2d'); c.fillStyle = this.state.color; c.beginPath(); c.arc(p[0], p[1], 6, 0, Math.PI * 2); c.fill(); }
  doneDraw = () => {
    if (this.state.phase !== 'draw') return;
    const effort = Math.min(1, (this.strokes || 0) / 6);
    const ok = Math.random() < .35 + effort * .55; const ft = 5 + Math.floor(Math.random() * 18);
    this.setState({ phase:'mid', fPts: ok ? Math.max(10, 100 - ft * 4) : 0, fTime: ok ? ft : 0, sec:0 });
    this.strokes = 0;
    this.tm = setTimeout(() => this.setState({ phase:'mid2' }), (this.props.delay ?? 700) * 2.4);
  };
  startGuess = () => { this.setState({ phase:'guess', sec:0 }); };
  pick(w) {
    const s = this.state; if (s.phase !== 'guess') return;
    const ok = w && w[0] === s.theirs[0]; const mPts = ok ? Math.max(10, 100 - s.sec * 5) : 0;
    const r = mPts > s.fPts ? 'me' : s.fPts > mPts ? 'friend' : 'draw';
    this.setState({ phase:'end', mPts, result:r }); this.props.onFinish && this.props.onFinish(r);
  }
  renderVals() {
    const L = this.props.labels || {}; const lang = this.props.lang === 'he' ? 'he' : 'es'; const t0 = T[lang]; const n = this.props.friendName || '';
    const t = Object.fromEntries(Object.entries(t0).map(([k, v]) => [k, fmt(v, { n })]));
    const s = this.state; const li = lang === 'he' ? 1 : 0;
    const status = s.result ? { text: s.result === 'me' ? L.win : s.result === 'draw' ? L.draw : L.lose, bg:'#1F2357', color:'#fff' }
      : s.phase === 'draw' ? { text:t.draw, bg:'#FFC93C', color:'#1F2357' } : s.phase === 'guess' ? { text:t.guess, bg:'#FFC93C', color:'#1F2357' } : { text:t.guessing, bg:'#FFE6D2', color:'#B5560F' };
    return {
      t, labels:L, status, isDraw: s.phase === 'draw', isMid: s.phase === 'mid' || s.phase === 'mid2', isGuess: s.phase === 'guess', canGuess: s.phase === 'mid2',
      showTimer: s.phase === 'draw' || s.phase === 'guess', timer: s.phase === 'draw' ? s.sec + 's' : s.sec + 's',
      myWord:s.mine[li], friendEmoji:s.theirs[2], blur: Math.max(0, 22 - s.sec * 2.2),
      midText: s.phase === 'mid' ? t.guessing : s.fPts ? fmt(t0.got, { n, s:s.fTime }) : fmt(t0.miss, { n }),
      colors: PAL.map(c => ({ c, ring: c === s.color ? '#FFC93C' : '#fff', onClick:() => this.setState({ color:c }) })),
      clear:() => { if (this.cv) this.cv.getContext('2d').clearRect(0, 0, 700, 560); },
      doneDraw:this.doneDraw, startGuess:this.startGuess, cvRef:this.cvRef, pd:this.pd, pm:this.pm, pu:this.pu,
      opts: s.opts.map(w => ({ label:w[li], onClick:() => this.pick(w) })),
      done:!!s.result,
      res: s.result ? { title: s.result === 'me' ? L.win : s.result === 'draw' ? L.draw : L.lose, pts: s.result === 'me' ? '+30' : s.result === 'draw' ? '+10' : '+0', color: s.result === 'me' ? '#F2508E' : s.result === 'draw' ? '#4B5BE8' : '#FF8A2A', sub: fmt(t0.sub, { n, a:s.mPts, b:s.fPts }) } : {},
      restart:() => { clearTimeout(this.tm); this.setState(this.init()); }, back:() => this.props.onBack && this.props.onBack()
    };
  }
}
</script>
</body>
</html>
