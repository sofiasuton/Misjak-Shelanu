<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Fredoka', system-ui, sans-serif; color:#1F2357">
  <div style="background:#fff; border-radius:34px; padding:12px; display:flex; flex-direction:column; gap:10px; box-shadow:0 16px 0 rgba(31,35,87,.18)">
    <div style="border-radius:999px; padding:10px 16px; font-weight:600; font-size:14px; text-align:center; background:{{ status.bg }}; color:{{ status.color }}">{{ status.text }}</div>
    <div dir="ltr" style="background:#3343C9; border-radius:20px; padding:6px; display:flex; flex-direction:column; gap:6px">
      <div style="display:grid; grid-template-columns:repeat(12,1fr); gap:2px">
        <sc-for list="{{ top }}" as="p" hint-placeholder-count="12">
          <button onClick="{{ p.onClick }}" style="position:relative; height:122px; border:0; padding:2px 1px; border-radius:6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; background:{{ p.bg }}">
            <span style="position:absolute; inset:0; clip-path:polygon(0 0,100% 0,50% 92%); background:{{ p.tri }}"></span>
            <sc-for list="{{ p.ch }}" as="k" hint-placeholder-count="0">
              <span style="position:relative; width:100%; aspect-ratio:1; border-radius:50%; background:{{ k.c }}; border:2px solid #fff; font-size:10px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; box-shadow:{{ k.ring }}">{{ k.n }}</span>
            </sc-for>
          </button>
        </sc-for>
      </div>
      <div style="background:#EEF0FF; border-radius:14px; padding:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:space-between">
        <button onClick="{{ barClick }}" style="border:0; cursor:pointer; border-radius:999px; padding:6px 10px; font-family:inherit; font-size:12px; font-weight:600; background:{{ barBg }}; color:#1F2357">{{ barText }}</button>
        <div style="display:flex; gap:6px; align-items:center">
          <sc-for list="{{ dice }}" as="d" hint-placeholder-count="2">
            <span style="width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; background:{{ d.bg }}; color:{{ d.color }}">{{ d.v }}</span>
          </sc-for>
          <sc-if value="{{ canRoll }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ roll }}" style="border:0; cursor:pointer; border-radius:999px; padding:8px 16px; background:#F2508E; color:#fff; font-family:inherit; font-weight:700; font-size:14px; box-shadow:0 3px 0 #C93670">{{ t.roll }}</button>
          </sc-if>
        </div>
        <button onClick="{{ offClick }}" style="border:0; cursor:pointer; border-radius:999px; padding:6px 10px; font-family:inherit; font-size:12px; font-weight:600; background:{{ offBg }}; color:#1F2357">{{ offText }}</button>
      </div>
      <div style="display:grid; grid-template-columns:repeat(12,1fr); gap:2px">
        <sc-for list="{{ bottom }}" as="p" hint-placeholder-count="12">
          <button onClick="{{ p.onClick }}" style="position:relative; height:122px; border:0; padding:2px 1px; border-radius:6px; cursor:pointer; display:flex; flex-direction:column-reverse; align-items:center; gap:1px; background:{{ p.bg }}">
            <span style="position:absolute; inset:0; clip-path:polygon(50% 8%,100% 100%,0 100%); background:{{ p.tri }}"></span>
            <sc-for list="{{ p.ch }}" as="k" hint-placeholder-count="0">
              <span style="position:relative; width:100%; aspect-ratio:1; border-radius:50%; background:{{ k.c }}; border:2px solid #fff; font-size:10px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; box-shadow:{{ k.ring }}">{{ k.n }}</span>
            </sc-for>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="text-align:center; font-size:12px; color:#6B70A0">{{ t.help }}</div>
  </div>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff; border-radius:30px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; box-shadow:0 14px 34px rgba(31,35,87,.2)">
      <div style="align-self:stretch; background:#4B5BE8; color:#fff; border-radius:999px; padding:10px; font-weight:700; font-size:18px">{{ res.title }}</div>
      <div style="font-size:44px; font-weight:700; line-height:1; color:{{ res.color }}">{{ res.pts }}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; align-self:stretch">
        <button onClick="{{ restart }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ labels.again }}</button>
        <button onClick="{{ back }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#4B5BE8; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #3343C9">{{ labels.back }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:560}}">
const T = { es:{ roll:'Tirar', rollFirst:'Tirá los dados', pick:'Elegí una ficha', dest:'Elegí a dónde moverla', none:'No tenés movimientos', bar:'Barra {a}·{b}', off:'Afuera {a}·{b}', help:'Movés las rosas hacia abajo a la derecha · Sacás desde tu cuadrante', rolling:'{n} está jugando…' },
            he:{ roll:'הטלה', rollFirst:'הטילו את הקוביות', pick:'בחרו אבן', dest:'בחרו לאן להזיז', none:'אין מהלכים', bar:'בר {a}·{b}', off:'בחוץ {a}·{b}', help:'האבנים הוורודות נעות לפינה הימנית התחתונה', rolling:'{n} משחק/ת…' } };
const fmt = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k] ?? '');
const start = () => { const p = Array(24).fill(0); p[23] = 2; p[12] = 5; p[7] = 3; p[5] = 5; p[0] = -2; p[11] = -5; p[16] = -3; p[18] = -5; return p; };
const own = (p, v) => p === 'me' ? v > 0 : v < 0;
const blocked = (pts, p, j) => p === 'me' ? pts[j] <= -2 : pts[j] >= 2;
const allHome = (s, p) => s.bar[p] === 0 && s.pts.every((v, i) => !own(p, v) || (p === 'me' ? i <= 5 : i >= 18));
function movesDie(s, p, d) {
  const dir = p === 'me' ? -1 : 1, out = [];
  if (s.bar[p] > 0) { const j = p === 'me' ? 24 - d : d - 1; return blocked(s.pts, p, j) ? [] : [{ from:'bar', to:j, d }]; }
  const home = allHome(s, p);
  for (let i = 0; i < 24; i++) { if (!own(p, s.pts[i])) continue; const j = i + dir * d;
    if (j >= 0 && j <= 23) { if (!blocked(s.pts, p, j)) out.push({ from:i, to:j, d }); }
    else if (home) { const exact = p === 'me' ? j === -1 : j === 24;
      const further = p === 'me' ? s.pts.some((v, k) => k > i && k <= 5 && own(p, v)) : s.pts.some((v, k) => k < i && k >= 18 && own(p, v));
      if (exact || !further) out.push({ from:i, to:'off', d }); } }
  return out;
}
const allMoves = (s, p) => [...new Set(s.dice)].flatMap(d => movesDie(s, p, d));
function apply(s, p, m) {
  const pts = s.pts.slice(), bar = { ...s.bar }, off = { ...s.off }, sg = p === 'me' ? 1 : -1, opp = p === 'me' ? 'friend' : 'me';
  if (m.from === 'bar') bar[p]--; else pts[m.from] -= sg;
  if (m.to === 'off') off[p]++; else { if (pts[m.to] === -sg) { pts[m.to] = 0; bar[opp]++; } pts[m.to] += sg; }
  const dice = s.dice.slice(); dice.splice(dice.indexOf(m.d), 1);
  return { pts, bar, off, dice };
}
const r6 = () => 1 + Math.floor(Math.random() * 6);

class Component extends DCLogic {
  init() { return { pts:start(), bar:{ me:0, friend:0 }, off:{ me:0, friend:0 }, dice:[], rolled:[], turn:'me', sel:null, msg:'', result:null }; }
  state = this.init();
  componentWillUnmount() { clearTimeout(this.tm); }
  get d() { return this.props.delay ?? 700; }
  t() { return T[this.props.lang === 'he' ? 'he' : 'es']; }
  finish(w) { if (this.state.result) return; this.setState({ result:w }); this.props.onFinish && this.props.onFinish(w); }
  rollDice() { const a = r6(), b = r6(); return a === b ? [a, a, a, a] : [a, b]; }
  roll = () => { const s = this.state; if (s.turn !== 'me' || s.dice.length || s.result) return;
    const dice = this.rollDice(); const ns = { ...s, dice }; this.setState({ dice, rolled:dice.slice(), sel:null, msg:'' });
    if (!allMoves(ns, 'me').length) { this.setState({ msg:this.t().none }); this.tm = setTimeout(() => this.pass('friend'), this.d * 1.6); } };
  pass(to) { this.setState({ dice:[], sel:null, turn:to, msg:'' }); if (to === 'friend') this.tm = setTimeout(() => this.aiRoll(), this.d); }
  src(x) { const s = this.state; if (s.turn !== 'me' || !s.dice.length || s.result) return false;
    const ms = allMoves(s, 'me'); if (ms.some(m => m.from === x)) { this.setState({ sel:x }); return true; } return false; }
  dest(x) { const s = this.state; if (s.sel == null) return false;
    const m = allMoves(s, 'me').filter(m => m.from === s.sel && m.to === x).sort((a, b) => a.d - b.d)[0]; if (!m) return false;
    const ns = { ...s, ...apply(s, 'me', m) }; this.setState({ ...ns, sel:null });
    if (ns.off.me === 15) { this.finish('me'); return true; }
    if (!ns.dice.length) this.tm = setTimeout(() => this.pass('friend'), 350);
    else if (!allMoves(ns, 'me').length) { this.setState({ msg:this.t().none }); this.tm = setTimeout(() => this.pass('friend'), this.d * 1.4); }
    return true; }
  point(i) { if (!this.dest(i)) this.src(i); }
  aiRoll() { const dice = this.rollDice(); this.setState({ dice, rolled:dice.slice() }); this.tm = setTimeout(() => this.aiStep(), this.d); }
  aiStep() {
    const s = this.state; const ms = allMoves(s, 'friend');
    if (!ms.length) return this.pass('me');
    const score = m => { let v = Math.random() * .5;
      if (m.to === 'off') v += 4; else { const t = s.pts[m.to]; if (t === 1) v += 5; if (t === -1) v += 3; if (t === 0) v -= 1; if (t <= -2) v += .5; }
      if (m.from !== 'bar' && s.pts[m.from] === -2) v -= 1.5; if (m.from !== 'bar' && m.from < 6) v += .6; return v; };
    const m = ms.map(m => [score(m), m]).sort((a, b) => b[0] - a[0])[0][1];
    const ns = { ...s, ...apply(s, 'friend', m) }; this.setState(ns);
    if (ns.off.friend === 15) return this.finish('friend');
    this.tm = setTimeout(() => ns.dice.length ? this.aiStep() : this.pass('me'), this.d * .8);
  }
  renderVals() {
    const L = this.props.labels || {}; const t = this.t(); const s = this.state; const n = this.props.friendName || '';
    const myMoves = s.turn === 'me' && !s.result ? allMoves(s, 'me') : [];
    const srcs = new Set(myMoves.map(m => m.from)); const dests = new Set(myMoves.filter(m => m.from === s.sel).map(m => m.to));
    const col = i => { const v = s.pts[i], c = Math.abs(v), shown = Math.min(c, 5);
      return { onClick:() => this.point(i), tri: i % 2 ? '#7B8BF0' : '#C9CFFF', bg: dests.has(i) ? 'rgba(255,201,60,.55)' : 'transparent',
        ch: Array.from({ length:shown }, (_, k) => ({ c: v > 0 ? '#F2508E' : '#FF8A2A', n: k === shown - 1 && c > 5 ? c : '',
          ring: k === shown - 1 && (s.sel === i ? true : (s.sel == null && srcs.has(i))) ? '0 0 0 3px #FFC93C' : 'none' })) }; };
    return {
      t, labels:L, done:!!s.result,
      top: Array.from({ length:12 }, (_, k) => col(12 + k)), bottom: Array.from({ length:12 }, (_, k) => col(11 - k)),
      dice: (s.rolled.length ? s.rolled : []).map((v, k) => ({ v, bg: k < s.rolled.length - s.dice.length ? '#C9CFFF' : (s.turn === 'me' ? '#fff' : '#FFE6D2'), color: s.turn === 'me' ? '#1F2357' : '#B5560F' })),
      canRoll: s.turn === 'me' && !s.dice.length && !s.result, roll:this.roll,
      barText: fmt(t.bar, { a:s.bar.me, b:s.bar.friend }), barBg: s.sel === 'bar' ? '#FFC93C' : srcs.has('bar') ? '#FFE9A8' : '#fff', barClick:() => this.src('bar'),
      offText: fmt(t.off, { a:s.off.me, b:s.off.friend }), offBg: dests.has('off') ? '#FFC93C' : '#fff', offClick:() => this.dest('off'),
      status: s.result ? { text: s.result === 'me' ? L.win : L.lose, bg:'#1F2357', color:'#fff' }
        : s.turn === 'me' ? { text: s.msg || (!s.dice.length ? t.rollFirst : s.sel == null ? t.pick : t.dest), bg:'#FFC93C', color:'#1F2357' } : { text:fmt(t.rolling, { n }), bg:'#FFE6D2', color:'#B5560F' },
      res: s.result ? { title: s.result === 'me' ? L.win : L.lose, pts: s.result === 'me' ? '+30' : '+0', color: s.result === 'me' ? '#F2508E' : '#FF8A2A' } : {},
      restart:() => { clearTimeout(this.tm); this.setState(this.init()); }, back:() => this.props.onBack && this.props.onBack()
    };
  }
}
</script>
</body>
</html>
