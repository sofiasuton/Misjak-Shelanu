<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Fredoka', system-ui, sans-serif; color:#1F2357">
  <div style="background:#fff; border-radius:34px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 16px 0 rgba(31,35,87,.18)">
    <div style="display:flex; gap:8px; align-items:center">
      <div style="flex:1; border-radius:999px; padding:10px 14px; font-weight:600; font-size:14px; text-align:center; background:{{ status.bg }}; color:{{ status.color }}">{{ status.text }}</div>
      <span style="border-radius:999px; padding:8px 12px; background:#FFE0EC; color:#C93670; font-weight:700; font-size:14px">{{ meName }} {{ score.me }}</span>
      <span style="border-radius:999px; padding:8px 12px; background:#FFE6D2; color:#B5560F; font-weight:700; font-size:14px">{{ friendName }} {{ score.friend }}</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="16">
        <button onClick="{{ c.onClick }}" style="aspect-ratio:1; border:0; border-radius:18px; cursor:pointer; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:34px; background:{{ c.bg }}; box-shadow:0 4px 0 {{ c.shade }}">
          <sc-if value="{{ c.hidden }}" hint-placeholder-val="{{ true }}"><span style="width:26px; height:26px; border-radius:50%; border:6px solid rgba(255,255,255,.35)"></span></sc-if>
          <sc-if value="{{ c.shown }}" hint-placeholder-val="{{ false }}"><span>{{ c.e }}</span></sc-if>
        </button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff; border-radius:30px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; box-shadow:0 14px 34px rgba(31,35,87,.2)">
      <div style="align-self:stretch; background:#4B5BE8; color:#fff; border-radius:999px; padding:10px; font-weight:700; font-size:18px">{{ res.title }}</div>
      <div style="font-size:44px; font-weight:700; line-height:1; color:{{ res.color }}">{{ res.pts }}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; align-self:stretch">
        <button onClick="{{ restart }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ labels.again }}</button>
        <button onClick="{{ back }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#4B5BE8; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #3343C9">{{ labels.back }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:520}}">
const EMO = ['🧉','🧆','🐪','⚽','🌵','🍕','🎸','🌊'];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

class Component extends DCLogic {
  init() { this.mem = {}; return { cards:shuffle([...EMO, ...EMO]).map(e => ({ e, up:false, owner:null })), sel:[], turn:'me', score:{ me:0, friend:0 }, lock:false, result:null }; }
  state = this.init();
  componentWillUnmount() { clearTimeout(this.tm); clearTimeout(this.tm2); }
  get d() { return this.props.delay ?? 700; }
  finish(w) { if (this.state.result) return; this.setState({ result:w }); this.props.onFinish && this.props.onFinish(w); }
  reveal(i) {
    const s = this.state; const cards = s.cards.slice(); cards[i] = { ...cards[i], up:true };
    if (Math.random() < .8) this.mem[i] = cards[i].e;
    const sel = [...s.sel, i];
    this.setState({ cards, sel, lock: sel.length === 2 });
    if (sel.length === 2) this.tm = setTimeout(() => this.resolve(), 850);
  }
  flip(i) { const s = this.state; if (s.turn !== 'me' || s.lock || s.result || s.cards[i].up || s.cards[i].owner) return; this.reveal(i); }
  resolve() {
    const s = this.state; const [a, b] = s.sel; const cards = s.cards.slice(); const match = cards[a].e === cards[b].e;
    let turn = s.turn, score = s.score;
    if (match) { cards[a] = { ...cards[a], owner:turn }; cards[b] = { ...cards[b], owner:turn }; score = { ...score, [turn]:score[turn] + 1 }; delete this.mem[a]; delete this.mem[b]; }
    else { cards[a] = { ...cards[a], up:false }; cards[b] = { ...cards[b], up:false }; turn = turn === 'me' ? 'friend' : 'me'; }
    this.setState({ cards, sel:[], score, turn, lock:false });
    if (cards.every(c => c.owner)) return this.finish(score.me > score.friend ? 'me' : score.friend > score.me ? 'friend' : 'draw');
    if (turn === 'friend') this.tm = setTimeout(() => this.ai1(), this.d);
  }
  open() { return this.state.cards.map((c, i) => (!c.owner && !c.up) ? i : -1).filter(i => i >= 0); }
  ai1() {
    const open = this.open(); const known = open.filter(i => this.mem[i]);
    for (const i of known) { const j = known.find(k => k !== i && this.mem[k] === this.mem[i]); if (j !== undefined) { this.reveal(i); this.tm2 = setTimeout(() => this.reveal(j), 600); return; } }
    const unknown = open.filter(i => !this.mem[i]); const first = (unknown.length ? unknown : open)[Math.floor(Math.random() * (unknown.length || open.length))];
    this.reveal(first);
    this.tm2 = setTimeout(() => {
      const e = this.state.cards[first].e; const rest = this.open();
      const match = rest.find(k => this.mem[k] === e);
      const pool = rest.filter(k => !this.mem[k]);
      this.reveal(match !== undefined ? match : (pool.length ? pool : rest)[Math.floor(Math.random() * (pool.length || rest.length))]);
    }, 600);
  }
  renderVals() {
    const L = this.props.labels || {}; const { cards, turn, result, score } = this.state;
    return {
      labels:L, meName:this.props.meName, friendName:this.props.friendName, score, done:!!result,
      res: result ? { title: result === 'me' ? L.win : result === 'draw' ? L.draw : L.lose, pts: result === 'me' ? '+30' : result === 'draw' ? '+10' : '+0', color: result === 'me' ? '#F2508E' : result === 'draw' ? '#4B5BE8' : '#FF8A2A' } : {},
      restart:() => { clearTimeout(this.tm); clearTimeout(this.tm2); this.setState(this.init()); }, back:() => this.props.onBack && this.props.onBack(),
      status: result ? { text: result === 'me' ? L.win : result === 'draw' ? L.draw : L.lose, bg:'#1F2357', color:'#fff' } : turn === 'me' ? { text:L.yourTurn, bg:'#FFC93C', color:'#1F2357' } : { text:L.theirTurn, bg:'#FFE6D2', color:'#B5560F' },
      cards: cards.map((c, i) => { const shown = c.up || !!c.owner;
        return { e:c.e, shown, hidden:!shown, onClick:() => this.flip(i),
          bg: c.owner === 'me' ? '#FFE0EC' : c.owner === 'friend' ? '#FFE6D2' : c.up ? '#fff' : '#4B5BE8',
          shade: c.owner === 'me' ? '#F2508E' : c.owner === 'friend' ? '#FF8A2A' : c.up ? '#DDE1FF' : '#3343C9' }; })
    };
  }
}
</script>
</body>
</html>
