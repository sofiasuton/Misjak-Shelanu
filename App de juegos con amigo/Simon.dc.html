<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Fredoka', system-ui, sans-serif; color:#1F2357">
  <div style="background:#fff; border-radius:34px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 16px 0 rgba(31,35,87,.18)">
    <div style="border-radius:999px; padding:10px 16px; font-weight:600; font-size:14px; text-align:center; background:{{ status.bg }}; color:{{ status.color }}">{{ status.text }}</div>
    <div dir="ltr" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; aspect-ratio:1; max-width:320px; width:100%; align-self:center">
      <sc-for list="{{ pads }}" as="p" hint-placeholder-count="4">
        <button onClick="{{ p.onClick }}" style="border:0; cursor:pointer; border-radius:{{ p.r }}; background:{{ p.bg }}; opacity:{{ p.op }}; transform:scale({{ p.sc }}); box-shadow:0 6px 0 {{ p.shade }}; transition:opacity .12s, transform .12s"></button>
      </sc-for>
    </div>
    <div style="display:flex; justify-content:center; gap:10px; align-items:center">
      <span style="font-size:14px; color:#6B70A0">{{ roundLbl }}</span>
      <span style="font-size:28px; font-weight:700; color:#4B5BE8">{{ round }}</span>
    </div>
    <sc-if value="{{ canStart }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ start }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ startLbl }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff; border-radius:30px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; box-shadow:0 14px 34px rgba(31,35,87,.2)">
      <div style="align-self:stretch; background:#4B5BE8; color:#fff; border-radius:999px; padding:10px; font-weight:700; font-size:18px">{{ res.title }}</div>
      <div style="font-size:44px; font-weight:700; line-height:1; color:{{ res.color }}">{{ res.pts }}</div>
      <div style="font-size:14px; color:#6B70A0">{{ res.sub }}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; align-self:stretch">
        <button onClick="{{ restart }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ labels.again }}</button>
        <button onClick="{{ back }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#4B5BE8; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #3343C9">{{ labels.back }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:600}}">
const P = [['#F2508E','#C93670','999px 30px 30px 30px'],['#FF8A2A','#D16A14','30px 999px 30px 30px'],['#A8E03A','#7FB01F','30px 30px 30px 999px'],['#2FB3E8','#1F8DBA','30px 30px 999px 30px']];
const T = { es:{ watch:'Mirá la secuencia…', repeat:'Repetila tocando los colores', start:'Empezar', round:'Ronda', ready:'Memorizá y repetí la secuencia', cpu:'Llegaste a {a} rondas · 6 o más: +30 · 3 a 5: +10', t0:'¡Gran memoria!', t1:'¡Bien!', t2:'A practicar' },
            he:{ watch:'הסתכלו על הרצף…', repeat:'חזרו על הרצף בלחיצה על הצבעים', start:'להתחיל', round:'סיבוב', ready:'זכרו וחזרו על הרצף', cpu:'הגעתם ל־{a} סיבובים · 6 ומעלה: +30 · 3 עד 5: +10', t0:'זיכרון מעולה!', t1:'יפה!', t2:'צריך להתאמן' } };
let AC = null; const beep = i => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = [330, 392, 494, 587][i]; o.type = 'triangle'; g.gain.setValueAtTime(.12, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .3); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + .32); } catch (e) {} };
const fmt = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k] ?? '');
const resOf = (L, r, sub) => r ? { title: r === 'me' ? L.win : r === 'draw' ? L.draw : L.lose, pts: r === 'me' ? '+30' : r === 'draw' ? '+10' : '+0', color: r === 'me' ? '#F2508E' : r === 'draw' ? '#4B5BE8' : '#FF8A2A', sub: sub || '' } : {};
const stOf = (L, r, turn, t) => r ? { text: r === 'me' ? L.win : r === 'draw' ? L.draw : L.lose, bg:'#1F2357', color:'#fff' } : turn === 'me' ? { text: t || L.yourTurn, bg:'#FFC93C', color:'#1F2357' } : { text:L.theirTurn, bg:'#FFE6D2', color:'#B5560F' };
class Component extends DCLogic {
  init() { return { seq:[], pos:0, phase:'idle', lit:-1, result:null, cpu: 4 + Math.floor(Math.random() * 6) }; }
  state = this.init();
  componentWillUnmount() { this.tms && this.tms.forEach(clearTimeout); }
  later(fn, ms) { this.tms = this.tms || []; this.tms.push(setTimeout(fn, ms)); }
  next(seq) { const s2 = [...seq, Math.floor(Math.random() * 4)]; this.setState({ seq:s2, pos:0, phase:'show', lit:-1 });
    const gap = Math.max(260, 620 - s2.length * 30);
    s2.forEach((v, k) => { this.later(() => { this.setState({ lit:v }); beep(v); }, 500 + k * gap); this.later(() => this.setState({ lit:-1 }), 500 + k * gap + gap * .6); });
    this.later(() => this.setState({ phase:'input' }), 500 + s2.length * gap); }
  press(i) {
    const s = this.state; if (s.phase !== 'input') return;
    this.setState({ lit:i }); beep(i); this.later(() => this.setState({ lit:-1 }), 180);
    if (s.seq[s.pos] !== i) { const mine = s.seq.length - 1; const w = mine >= 6 ? 'me' : mine >= 3 ? 'draw' : 'friend'; this.setState({ phase:'over', result:w }); this.props.onFinish && this.props.onFinish(w); return; }
    if (s.pos + 1 === s.seq.length) { this.setState({ phase:'wait' }); this.later(() => this.next(s.seq), 650); } else this.setState({ pos:s.pos + 1 });
  }
  renderVals() {
    const L = this.props.labels || {}, s = this.state, t = T[this.props.lang === 'he' ? 'he' : 'es'];
    const txt = s.phase === 'show' || s.phase === 'wait' ? t.watch : s.phase === 'input' ? t.repeat : t.ready;
    return { labels:L, done:!!s.result, canStart: s.phase === 'idle', start:() => this.next([]), startLbl:t.start, roundLbl:t.round, round: Math.max(s.seq.length, 0),
      status: s.result ? { text: s.result === 'me' ? t.t0 : s.result === 'draw' ? t.t1 : t.t2, bg:'#1F2357', color:'#fff' } : { text:txt, bg: s.phase === 'input' ? '#FFC93C' : '#EEF0FF', color:'#1F2357' },
      pads: P.map(([bg, shade, r], i) => ({ bg, shade, r, op: s.lit === i ? 1 : s.phase === 'idle' ? .9 : .55, sc: s.lit === i ? 1.04 : 1, onClick:() => this.press(i) })),
      res: s.result ? { ...resOf(L, s.result, fmt(t.cpu, { a:Math.max(s.seq.length - 1, 0) })), title: s.result === 'me' ? t.t0 : s.result === 'draw' ? t.t1 : t.t2 } : {},
      restart:() => { this.tms && this.tms.forEach(clearTimeout); this.setState(this.init()); }, back:() => this.props.onBack && this.props.onBack() };
  }
}
</script>
</body>
</html>
