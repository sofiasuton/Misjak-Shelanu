<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Fredoka', system-ui, sans-serif; color:#1F2357">
  <div style="background:#fff; border-radius:34px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 16px 0 rgba(31,35,87,.18)">
    <div style="border-radius:999px; padding:10px 16px; font-weight:600; font-size:14px; text-align:center; background:{{ status.bg }}; color:{{ status.color }}">{{ status.text }}</div>
    <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:600; color:#6B70A0">
      <span>{{ t.enemy }}</span><span>{{ enemyLeft }}</span>
    </div>
    <div dir="ltr" style="display:grid; grid-template-columns:repeat(8,1fr); gap:4px; background:#4B5BE8; padding:6px; border-radius:20px">
      <sc-for list="{{ enemy }}" as="c" hint-placeholder-count="64">
        <button onClick="{{ c.onClick }}" style="aspect-ratio:1; border:0; padding:0; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; background:{{ c.bg }}; color:#fff">{{ c.mark }}</button>
      </sc-for>
    </div>
    <div style="display:flex; gap:12px; align-items:center">
      <div dir="ltr" style="width:150px; flex:none; display:grid; grid-template-columns:repeat(8,1fr); gap:2px; background:#EEF0FF; padding:4px; border-radius:12px">
        <sc-for list="{{ mine }}" as="c" hint-placeholder-count="64">
          <div style="aspect-ratio:1; border-radius:4px; background:{{ c.bg }}"></div>
        </sc-for>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; font-size:13px">
        <div style="font-weight:600">{{ t.fleet }}</div>
        <div style="color:#6B70A0">{{ myLeft }}</div>
        <sc-if value="{{ canShuffle }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ reshuffle }}" style="border:3px solid #DDE1FF; cursor:pointer; border-radius:999px; padding:6px 12px; background:#fff; color:#4B5BE8; font-family:inherit; font-weight:600; font-size:13px">{{ t.move }}</button>
        </sc-if>
      </div>
    </div>
  </div>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff; border-radius:30px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; box-shadow:0 14px 34px rgba(31,35,87,.2)">
      <div style="align-self:stretch; background:#4B5BE8; color:#fff; border-radius:999px; padding:10px; font-weight:700; font-size:18px">{{ res.title }}</div>
      <div style="font-size:44px; font-weight:700; line-height:1; color:{{ res.color }}">{{ res.pts }}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; align-self:stretch">
        <button onClick="{{ restart }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#F2508E; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #C93670">{{ labels.again }}</button>
        <button onClick="{{ back }}" style="border:0; cursor:pointer; border-radius:999px; padding:13px; background:#4B5BE8; color:#fff; font-weight:700; font-size:16px; font-family:inherit; box-shadow:0 4px 0 #3343C9">{{ labels.back }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:640}}">
const N = 8, SHIPS = [4, 3, 3, 2, 2];
const T = { es:{ enemy:'Mar de {n}', fleet:'Tu flota', move:'Reubicar', left:'{a} barcos a flote', hit:'¡Tocado! Tirá de nuevo', sunk:'¡Hundido! Tirá de nuevo', water:'Agua', aim:'Elegí dónde disparar', fHit:'{n} te tocó un barco', fMiss:'{n} tiró al agua' },
            he:{ enemy:'הים של {n}', fleet:'הצי שלך', move:'סידור מחדש', left:'{a} ספינות שטות', hit:'פגיעה! ירו שוב', sunk:'טובעה! ירו שוב', water:'מים', aim:'בחרו לאן לירות', fHit:'{n} פגע/ה בספינה שלך', fMiss:'{n} פספס/ה' } };
const fmt = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k] ?? '');
const place = () => { const g = Array(N * N).fill(-1);
  SHIPS.forEach((len, id) => { for (;;) { const h = Math.random() < .5, r = Math.floor(Math.random() * (h ? N : N - len + 1)), c = Math.floor(Math.random() * (h ? N - len + 1 : N));
    const cells = Array.from({ length:len }, (_, k) => h ? r * N + c + k : (r + k) * N + c);
    if (cells.every(i => g[i] === -1)) { cells.forEach(i => g[i] = id); break; } } });
  return g; };
const sunkIds = (g, shots) => SHIPS.map((_, id) => g.every((v, i) => v !== id || shots[i])).map((s, id) => s ? id : -1).filter(x => x >= 0);

class Component extends DCLogic {
  init() { this.queue = []; return { mine:place(), theirs:place(), myShots:Array(N * N).fill(false), fShots:Array(N * N).fill(false), turn:'me', msg:'', result:null, started:false }; }
  state = this.init();
  componentWillUnmount() { clearTimeout(this.tm); }
  get d() { return this.props.delay ?? 700; }
  lang() { return T[this.props.lang === 'he' ? 'he' : 'es']; }
  finish(w) { if (this.state.result) return; this.setState({ result:w }); this.props.onFinish && this.props.onFinish(w); }
  shoot(i) {
    const s = this.state; if (s.turn !== 'me' || s.result || s.myShots[i]) return;
    const shots = s.myShots.slice(); shots[i] = true; const hit = s.theirs[i] >= 0; const t = this.lang();
    const before = sunkIds(s.theirs, s.myShots).length, after = sunkIds(s.theirs, shots).length;
    this.setState({ myShots:shots, started:true, msg: hit ? (after > before ? t.sunk : t.hit) : t.water, turn: hit ? 'me' : 'friend' });
    if (after === SHIPS.length) return this.finish('me');
    if (!hit) this.tm = setTimeout(() => this.ai(), this.d);
  }
  ai() {
    const s = this.state; const shots = s.fShots.slice(); let i;
    while (this.queue.length) { const q = this.queue.shift(); if (!shots[q]) { i = q; break; } }
    if (i === undefined) { const free = shots.map((v, k) => !v && ((k % N) + Math.floor(k / N)) % 2 === 0 ? k : -1).filter(k => k >= 0);
      const pool = free.length ? free : shots.map((v, k) => v ? -1 : k).filter(k => k >= 0); i = pool[Math.floor(Math.random() * pool.length)]; }
    shots[i] = true; const hit = s.mine[i] >= 0; const t = this.lang(); const n = this.props.friendName || '';
    if (hit) { const r = Math.floor(i / N), c = i % N; [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([rr, cc]) => { if (rr >= 0 && rr < N && cc >= 0 && cc < N) this.queue.push(rr * N + cc); }); }
    this.setState({ fShots:shots, msg: fmt(hit ? t.fHit : t.fMiss, { n }), turn: hit ? 'friend' : 'me' });
    if (sunkIds(s.mine, shots).length === SHIPS.length) return this.finish('friend');
    if (hit) this.tm = setTimeout(() => this.ai(), this.d);
  }
  renderVals() {
    const L = this.props.labels || {}; const t0 = this.lang(); const n = this.props.friendName || '';
    const t = Object.fromEntries(Object.entries(t0).map(([k, v]) => [k, fmt(v, { n })]));
    const s = this.state; const eSunk = new Set(sunkIds(s.theirs, s.myShots)), mSunk = new Set(sunkIds(s.mine, s.fShots));
    return {
      t, labels:L, done:!!s.result, canShuffle: !s.started && !s.result, reshuffle:() => this.setState({ mine:place() }),
      enemyLeft: fmt(t0.left, { a:SHIPS.length - eSunk.size }), myLeft: fmt(t0.left, { a:SHIPS.length - mSunk.size }),
      status: s.result ? { text: s.result === 'me' ? L.win : L.lose, bg:'#1F2357', color:'#fff' }
        : s.turn === 'me' ? { text: s.msg || t.aim, bg:'#FFC93C', color:'#1F2357' } : { text: s.msg || L.theirTurn, bg:'#FFE6D2', color:'#B5560F' },
      enemy: s.theirs.map((v, i) => { const shot = s.myShots[i];
        return { onClick:() => this.shoot(i), mark: shot ? (v >= 0 ? '✕' : '•') : '',
          bg: !shot ? '#EEF0FF' : v < 0 ? '#9AA6F5' : eSunk.has(v) ? '#1F2357' : '#F2508E' }; }),
      mine: s.mine.map((v, i) => ({ bg: s.fShots[i] ? (v >= 0 ? (mSunk.has(v) ? '#1F2357' : '#FF8A2A') : '#C9CFF5') : v >= 0 ? '#4B5BE8' : '#fff' })),
      res: s.result ? { title: s.result === 'me' ? L.win : L.lose, pts: s.result === 'me' ? '+30' : '+0', color: s.result === 'me' ? '#F2508E' : '#FF8A2A' } : {},
      restart:() => { clearTimeout(this.tm); this.setState(this.init()); }, back:() => this.props.onBack && this.props.onBack()
    };
  }
}
</script>
</body>
</html>
